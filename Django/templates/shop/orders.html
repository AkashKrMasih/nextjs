{% extends "shop/base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
<h1>Your orders</h1>
<ul>
  {% for order in orders %}
  <li>{{ order.id }} — {{ order.status }} — {{ order.amount_total }} {{ order.currency }}</li>
  {% empty %}
  <li>No orders yet.</li>
  {% endfor %}
</ul>
{% endblock %}
