{% extends "shop/base.html" %}
{% block title %}Admin — Products{% endblock %}
{% block content %}
<h1>Products</h1>
<table>
  <thead><tr><th>Name</th><th>Price</th><th>SKU</th></tr></thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td><a href="/products/{{ p.id }}/">{{ p.name }}</a></td>
      <td>{{ currency_symbol }}{{ p.price }}</td>
      <td>{{ p.friendly_id }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
